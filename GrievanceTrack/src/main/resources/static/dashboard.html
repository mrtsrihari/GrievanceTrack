<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - GrievanceTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">GrievanceTrack</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="grievances.html">Grievances</a></li>
                <li class="nav-item"><a class="nav-link" href="escalations.html">Escalations</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Dashboard</h2>
    <hr>
    <button class="btn btn-warning mb-3" onclick="triggerSLACheck()">Trigger Manual SLA Escalation Check</button>
    <div id="check-result" class="alert alert-info d-none"></div>

    <div class="row text-center mb-4">
        <div class="col-md-3">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5 class="card-title">Total Grievances</h5>
                    <h2 id="total-count">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-danger mb-3">
                <div class="card-body">
                    <h5 class="card-title">Escalated</h5>
                    <h2 id="escalated-count">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Resolved/Closed</h5>
                    <h2 id="resolved-count">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-info mb-3">
                <div class="card-body">
                    <h5 class="card-title">Active</h5>
                    <h2 id="active-count">0</h2>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function triggerSLACheck() {
        fetch('/api/escalations/check', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                const el = document.getElementById('check-result');
                el.textContent = data.message;
                el.classList.remove('d-none');
                loadStats(); // refresh counts
            });
    }

    function loadStats() {
        fetch('/api/grievances')
            .then(res => res.json())
            .then(data => {
                document.getElementById('total-count').textContent = data.length;
                let escalated = 0;
                let resolved = 0;
                let active = 0;
                
                data.forEach(g => {
                    if (g.status === 'ESCALATED') escalated++;
                    else if (g.status === 'RESOLVED' || g.status === 'CLOSED') resolved++;
                    else active++;
                });

                document.getElementById('escalated-count').textContent = escalated;
                document.getElementById('resolved-count').textContent = resolved;
                document.getElementById('active-count').textContent = active;
            });
    }
    loadStats();
</script>
</body>
</html>
