<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Citizens - GrievanceTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">GrievanceTrack</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="grievances.html">Grievances</a></li>
                <li class="nav-item"><a class="nav-link active" href="citizens.html">Citizens</a></li>
                <li class="nav-item"><a class="nav-link" href="departments.html">Departments</a></li>
                <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Citizens List</h2>
    <table class="table table-striped table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Registered At</th>
            </tr>
        </thead>
        <tbody id="citizen-tbody">
        </tbody>
    </table>
</div>

<script>
    function loadCitizens() {
        fetch('/api/citizens')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('citizen-tbody');
                tbody.innerHTML = '';
                data.forEach(c => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${c.id}</td>
                        <td>${c.name}</td>
                        <td>${c.email}</td>
                        <td>${c.phone}</td>
                        <td>${new Date(c.createdAt).toLocaleDateString()}</td>
                    `;
                    tbody.appendChild(tr);
                });
            });
    }
    loadCitizens();
</script>
</body>
</html>
