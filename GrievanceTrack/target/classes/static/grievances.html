<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grievances - GrievanceTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">GrievanceTrack</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="grievances.html">Grievances</a></li>
                <li class="nav-item"><a class="nav-link" href="escalations.html">Escalations</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>All Grievances</h2>
        <a href="grievance-form.html" class="btn btn-primary">File New Grievance</a>
    </div>
    
    <table class="table table-striped table-bordered">
        <thead class="">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>Citizen</th>
                <th>Priority</th>
                <th>Status</th>
                <th>SLA Deadline</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="grievance-tbody">
        </tbody>
    </table>
</div>

<!-- Status Update Modal -->
<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Update Status</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modalGrievanceId">
                <select id="newStatus" class="form-select">
                    <option value="ASSIGNED">ASSIGNED</option>
                    <option value="IN_PROGRESS">IN_PROGRESS</option>
                    <option value="RESOLVED">RESOLVED</option>
                    <option value="CLOSED">CLOSED</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="updateStatus()">Save changes</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const statusModal = new bootstrap.Modal(document.getElementById('statusModal'));

    function loadGrievances() {
        fetch('/api/grievances')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('grievance-tbody');
                tbody.innerHTML = '';
                data.forEach(g => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${g.grievanceNumber}</td>
                        <td>${g.title}</td>
                        <td>${g.category.name}</td>
                        <td>${g.citizen.name}</td>
                        <td><span class="badge bg-secondary">${g.priority}</span></td>
                        <td><span class="badge bg-${g.status === 'ESCALATED' ? 'danger' : g.status === 'RESOLVED' ? 'success' : 'primary'}">${g.status}</span></td>
                        <td>${new Date(g.slaDeadline).toLocaleString()}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-info" onclick="openStatusModal(${g.id}, '${g.status}')">Update Status</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
    }

    function openStatusModal(id, currentStatus) {
        document.getElementById('modalGrievanceId').value = id;
        document.getElementById('newStatus').value = currentStatus;
        statusModal.show();
    }

    function updateStatus() {
        const id = document.getElementById('modalGrievanceId').value;
        const status = document.getElementById('newStatus').value;
        
        fetch(`/api/grievances/${id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: status })
        }).then(res => {
            if(res.ok) {
                statusModal.hide();
                loadGrievances();
            } else {
                alert("Failed to update status.");
            }
        });
    }

    loadGrievances();
</script>
</body>
</html>
